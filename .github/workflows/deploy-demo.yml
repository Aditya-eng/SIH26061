name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Data integrity and no-synthetic-data checks
        run: npm test

      - name: Build the console
        run: npm run build

      # enablement: true provisions GitHub Pages for the repository if it has not
      # been switched on by hand yet, so the first deploy does not need a visit to
      # Settings -> Pages. It is a no-op once Pages exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # path is relative to the workspace, not to `working-directory`
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
